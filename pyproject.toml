[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "facetmark"
version = "1.4.0"
description = "Bookmark retrieval that indexes why you saved a page, not just what it says. Local-first on SQLite; the four-facet fusion it was built around lost its own ablation, and the shipped default says so."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "88lin" }]
keywords = ["bookmarks", "search", "retrieval", "rrf", "sqlite", "mcp", "embeddings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]

dependencies = [
  "sqlite-vec>=0.1.9",
  "httpx>=0.27",
  "trafilatura>=2.0",
  # Tier 2 of body extraction. Coarser than trafilatura, but succeeds on the
  # plain or unusual markup where trafilatura declines to guess -- measurably
  # so on the calibration set, which is why it is required and not an extra.
  "readability-lxml>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "fastmcp>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  # Required, not optional. FTS5's trigram tokenizer cannot match queries
  # shorter than 3 characters, and CJK two-character words are the dominant
  # query form (93% of titles in the calibration library contain CJK).
  # unicode61 alone is worse: it treats an entire CJK run as a single token.
  "jieba>=0.42",
]

[project.optional-dependencies]
# Only for embed_backend='local'. Left out of the base install on purpose:
# sentence-transformers pulls torch, which is larger than everything else here
# combined, and most users are pointing at an endpoint that embeds for them.
local = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "respx>=0.21",
  # Upper bound on purpose. ruff adds lint rules in minor releases, so an
  # unpinned dev dependency means CI can go red on a commit that changed
  # nothing -- which already happened once here. Raise the ceiling
  # deliberately, with the new findings fixed in the same commit.
  "ruff>=0.6,<0.17",
]

[project.scripts]
facetmark = "facetmark.cli:app"
fm = "facetmark.cli:app"

[project.urls]
Homepage = "https://github.com/88lin/facetmark"
Repository = "https://github.com/88lin/facetmark"
Issues = "https://github.com/88lin/facetmark/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/facetmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/facetmark"]
omit = ["*/mcp_server.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
