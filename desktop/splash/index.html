<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Facetmark</title>
  <link rel="stylesheet" href="native-ui.css">
</head>
<body class="launch-body" data-phase="connecting">
  <main class="splash">
    <div class="launch-identity">
      <span class="mark" aria-hidden="true"><img src="mark.svg" alt="" draggable="false"></span>
      <div class="copy">
        <h1>Facetmark</h1>
        <p id="status" role="status">正在打开你的收藏工作区…</p>
      </div>
    </div>
    <small id="hint">首次启动可能需要一点时间</small>
    <div class="launch-controls">
      <div class="track" id="track" aria-hidden="true"><span></span></div>
      <button class="restart" id="retry" type="button" aria-describedby="status hint" hidden>重新启动服务</button>
    </div>
  </main>
  <script src="loading.js"></script>
</body>
</html>
