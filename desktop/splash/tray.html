<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Facetmark tray</title>
  <link rel="stylesheet" href="native-ui.css">
</head>
<body class="tray-body" data-phase="open">
  <main class="tray-shell">
    <header class="tray-identity"><img src="mark.svg" alt="" draggable="false"><div><strong>Facetmark</strong><span id="tray-status">收藏工作区</span></div></header>
    <div class="tray-menu" role="menu" aria-label="Facetmark">
      <button class="tray-item" type="button" role="menuitem" data-action="show" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18 M9 9v11"/></svg>
        <span class="tray-label" data-en="Open workspace">打开收藏工作区</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="tray-divider" role="separator"></div>
      <button class="tray-item" type="button" role="menuitemcheckbox" aria-checked="false" data-action="startup" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M12 3v9 M6 5a9 9 0 1 0 12 0" stroke-linecap="round"/></svg>
        <span class="tray-label" data-en="Launch at login">开机启动</span><span class="tray-switch" aria-hidden="true"></span>
      </button>
      <button class="tray-item" type="button" role="menuitemcheckbox" aria-checked="false" data-action="shortcut" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M6 9h2m3 0h2m3 0h2 M6 12h2m3 0h2m3 0h2 M7 15h10" stroke-linecap="round"/></svg>
        <span class="tray-label" data-en="Global shortcut">全局快捷键</span><span class="tray-switch" aria-hidden="true"></span>
      </button>
      <button class="tray-item" type="button" role="menuitem" data-action="update" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5 M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tray-label" data-en="Check for updates">检查更新</span>
      </button>
      <div class="tray-divider" role="separator"></div>
      <button class="tray-item tray-item-exit" type="button" role="menuitem" data-action="exit" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5 M13 12h8m-4-4 4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="tray-label" data-en="Quit Facetmark">退出 Facetmark</span>
      </button>
    </div>
    <p id="tray-feedback" role="status">Ctrl + Shift + Space · 打开工作区</p>
  </main>
  <script src="tray.js"></script>
</body>
</html>
