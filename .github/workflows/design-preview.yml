name: design-directions
on:
  push:
    branches: ['desktop/**']
    paths:
      - '.impeccable/mocks/decision/*.html'
      - 'scripts/design_preview.py'
      - '.github/workflows/design-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: design-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/design_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facetmark-design-directions
          path: design-evidence/
          retention-days: 14
