name: cut-v0.1.0

on:
  push:
    paths:
      - '.github/workflows/cut-v0-1-0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build extension
        working-directory: extension
        run: |
          set -euo pipefail
          npm ci || npm install
          npm run build
          cd dist && zip -qr "$GITHUB_WORKSPACE/facetmark-extension.zip" .
          ls -l "$GITHUB_WORKSPACE/facetmark-extension.zip"

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/cut-v0-1-0.yml
          git commit -q -m "facetmark: drop one-shot release job"
          git push
          git tag -a v0.1.0 -m "facetmark v0.1.0"
          git push origin v0.1.0
          gh release create v0.1.0 "$GITHUB_WORKSPACE/facetmark-extension.zip" \
            --title "facetmark v0.1.0" \
            --notes "First release. Unpacked extension build is attached; the Python service installs with pip install facetmark or pip install -e . from source. Run facetmark import, facetmark index, then facetmark serve, and pair the extension with the token printed by facetmark token."
