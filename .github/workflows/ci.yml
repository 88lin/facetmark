name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # Windows is in the matrix because it is the primary target, and because the
    # paths that break there (LOCALAPPDATA data dir, chmod on the token file,
    # SQLite file locking) are exactly the ones a Linux-only CI would miss.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: uv pip install --system -e ".[dev]"
      - name: lint
        run: ruff check src tests scripts
      - name: test
        run: pytest -q --cov=facetmark --cov-report=term-missing

      # The in-process create_server() tests cannot see two whole classes of
      # failure: a stray print anywhere on the import chain corrupts the JSON-RPC
      # stream, and FastMCP silently declines to build a schema for some return
      # annotations. Both only show up on a real pipe. One shard is enough --
      # this forks a subprocess and speaks stdio to it, so it is the slowest
      # thing in the matrix and it is not OS-specific.
      - name: mcp end-to-end over a real stdio pipe
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/mcp_e2e.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
        working-directory: extension
      - run: npx tsc --noEmit
        working-directory: extension
      # The type checker cannot see past `await res.json() as T`, and it has no
      # opinion at all about what happens when `chrome.tabs.create` fails. These
      # run the shipping source directly under node's type stripping, against a
      # hand-written stand-in for the browser.
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: facetmark-extension
          path: extension/dist

  karakeep-plugin:
    # The karakeep search plugin is TypeScript that this repository ships but
    # never runs: it executes inside a karakeep checkout that is not here. What
    # can be checked without one is whether it still satisfies karakeep's
    # interface, so this compiles it against hand-written stubs of that
    # interface, pinned to upstream by git blob SHA.
    #
    # This job is offline and deterministic. Whether the stubs still match
    # upstream is a different question with a different failure mode, and it
    # lives in karakeep-drift.yml on a schedule -- upstream moving is not a
    # reason to fail somebody's pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
        working-directory: integrations/karakeep/typecheck
      - run: npx tsc --noEmit
        working-directory: integrations/karakeep/typecheck

      # Typechecking proves the plugin satisfies an interface. It says nothing
      # about whether the JSON it puts on the socket is the JSON the Python
      # routes parse -- two type systems can agree about a shape they each
      # describe separately and still disagree in bytes. This drives the real
      # provider with a recording fetch and fails if the request bodies moved.
      # The other half of the same contract runs in the `python` job, which
      # replays those bodies through the real app; neither job needs the other's
      # runtime, and drift on either side shows up as a diff in a checked-in file.
      - run: npm run contract:check
        working-directory: integrations/karakeep/typecheck
