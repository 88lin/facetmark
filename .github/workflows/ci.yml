name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # Windows is in the matrix because it is the primary target, and because the
    # paths that break there (LOCALAPPDATA data dir, chmod on the token file,
    # SQLite file locking) are exactly the ones a Linux-only CI would miss.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: uv pip install --system -e ".[dev]"
      - name: lint
        run: ruff check src tests scripts
      - name: test
        run: pytest -q --cov=facetmark --cov-report=term-missing

      # The in-process create_server() tests cannot see two whole classes of
      # failure: a stray print anywhere on the import chain corrupts the JSON-RPC
      # stream, and FastMCP silently declines to build a schema for some return
      # annotations. Both only show up on a real pipe. One shard is enough --
      # this forks a subprocess and speaks stdio to it, so it is the slowest
      # thing in the matrix and it is not OS-specific.
      - name: mcp end-to-end over a real stdio pipe
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/mcp_e2e.py

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
        working-directory: extension
      - run: npx tsc --noEmit
        working-directory: extension
      # The type checker cannot see past `await res.json() as T`, and it has no
      # opinion at all about what happens when `chrome.tabs.create` fails. These
      # run the shipping source directly under node's type stripping, against a
      # hand-written stand-in for the browser.
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - uses: actions/upload-artifact@v4
        with:
          name: facetmark-extension
          path: extension/dist

  webui:
    # The search page at /app is four ES modules with no bundler and no test
    # runner, so the pure ones are tested with node's own. Sources live under
    # tests/ rather than inside the package: they must not ship in the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No install step on purpose. These modules import nothing, which is the
      # property that lets a page served out of a Python wheel have unit tests
      # at all, and a package.json here would quietly make that untrue.
      - run: node --test tests/web/*.test.mjs

  browser:
    # The three suites above read the interface as text. This one looks at it.
    #
    # `node --test` imports the pure modules and never builds a DOM;
    # tests/test_web.py greps the stylesheet, so it can say a media query
    # exists but not that the rule leaves the fifth tab on screen;
    # tests/test_landing.py diffs the committed HTML against a fresh render.
    # Four defects shipped straight through all three: a tab row that put the
    # fifth view off the right edge of a 390px phone with the scrollbar
    # hidden, an Escape handler that closed the dialog and then wiped the
    # search behind it, two colours with no dark-mode step, and a language
    # redirect that made one of the two languages unreachable. Each is one
    # measurement away from being caught, and this job is the measurement.
    #
    # It needs no fixtures and no secrets: `facetmark demo` builds a synthetic
    # forty-page library offline in about three seconds, and the landing pages
    # are already committed. The whole job is a couple of minutes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: uv pip install --system -e ".[dev]" playwright
      - name: browser
        run: python -m playwright install --with-deps chromium
      - name: drive the shipped pages
        run: python scripts/browser_check.py

  wheel:
    # .gitignore line 23 is `*.html`, and hatchling honours VCS ignore files
    # when it selects wheel contents. Without the negation added for this
    # feature, `pip install facetmark` builds cleanly, starts cleanly, and
    # serves a 404 at /app -- a failure that is invisible to every test in this
    # repository because they all run from the source tree. So: build the wheel
    # and look inside it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build --wheel
      - name: the web assets are in the wheel
        run: |
          python - <<'EOF'
          import pathlib, sys, zipfile
          wheel = sorted(pathlib.Path("dist").glob("*.whl"))[-1]
          names = set(zipfile.ZipFile(wheel).namelist())
          # Every static file the source tree ships, plus the page itself. The
          # list is read off the source rather than written out here, so adding
          # a module cannot silently ship a wheel that 404s on it.
          static = pathlib.Path("src/facetmark/web/static")
          # rglob, not iterdir: `static/fonts/` is a directory, and asking a
          # zip for a directory name asks for something that is not in it.
          # A dirty working tree is not a packaging bug: `__pycache__`, a
          # `.DS_Store` or an editor backup are not assets, and demanding them
          # inside the wheel makes a local run of this check fail for a reason
          # that has nothing to do with the wheel.
          want = ["facetmark/web/index.html"] + [
              f"facetmark/web/{p.relative_to(static.parent).as_posix()}"
              for p in sorted(static.rglob("*"))
              if p.is_file()
              and "__pycache__" not in p.parts
              and not p.name.startswith(".")
              and p.suffix not in {".pyc", ".pyo", ".bak", ".orig", ".rej", ".swp"}
          ]
          missing = [w for w in want if w not in names]
          if missing:
              print(f"{wheel.name} is missing: {missing}", file=sys.stderr)
              sys.exit(1)
          print(f"{wheel.name}: all {len(want)} web assets present")
          EOF

  karakeep-plugin:
    # The karakeep search plugin is TypeScript that this repository ships but
    # never runs: it executes inside a karakeep checkout that is not here. What
    # can be checked without one is whether it still satisfies karakeep's
    # interface, so this compiles it against hand-written stubs of that
    # interface, pinned to upstream by git blob SHA.
    #
    # This job is offline and deterministic. Whether the stubs still match
    # upstream is a different question with a different failure mode, and it
    # lives in karakeep-drift.yml on a schedule -- upstream moving is not a
    # reason to fail somebody's pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
        working-directory: integrations/karakeep/typecheck
      - run: npx tsc --noEmit
        working-directory: integrations/karakeep/typecheck

      # Typechecking proves the plugin satisfies an interface. It says nothing
      # about whether the JSON it puts on the socket is the JSON the Python
      # routes parse -- two type systems can agree about a shape they each
      # describe separately and still disagree in bytes. This drives the real
      # provider with a recording fetch and fails if the request bodies moved.
      # The other half of the same contract runs in the `python` job, which
      # replays those bodies through the real app; neither job needs the other's
      # runtime, and drift on either side shows up as a diff in a checked-in file.
      - run: npm run contract:check
        working-directory: integrations/karakeep/typecheck
