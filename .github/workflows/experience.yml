name: experience-validation
on:
  push:
    branches: ['desktop/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  opencode:
    name: Real OpenCode CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]'
      - run: npm install --global opencode-ai@1.19.0
      - run: python scripts/check_opencode.py
  web:
    runs-on: ubuntu-latest
    # The full browser matrix and 200k corpus consume up to 25 minutes before
    # video evidence and wheel packaging. Leave time for those final checks.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[dev]' build
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Selection cleanup and synthetic startup regression
        run: node scripts/check_workspace_polish.cjs
      - name: Stage offline native UI fonts
        run: python scripts/stage_native_ui.py
      - name: Build the shared React workbench
        id: frontend
        working-directory: frontend
        run: npm run build
      - name: Backend lint and regression
        run: |
          ruff check src tests scripts
          pytest -q
      - name: Browser for cloud validation
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare standalone recording encoder
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          pip install imageio-ffmpeg==0.6.0
          mkdir -p "$RUNNER_TEMP/facetmark-encoder"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/facetmark-encoder/ffmpeg"
          echo "$RUNNER_TEMP/facetmark-encoder" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/facetmark-encoder/ffmpeg" -version
      - name: Behavior and render matrix
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: frontend
        run: npm test
      - name: Real 200k collection API and bounded snapshot benchmark
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: python scripts/bench_collection.py
      - name: Preserve the primary browser report before the separate large-library run
        if: always()
        working-directory: frontend
        run: |
          if test -d test-results; then mv test-results test-results-matrix; fi
          if test -d playwright-report; then mv playwright-report playwright-report-matrix; fi
      - name: Real 200k browser paging and scoped selection
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        working-directory: frontend
        env:
          FACETMARK_LARGE_VALIDATION: '1'
        run: npx playwright test large-collection.spec.ts
      - name: Prepare small visual evidence with source provenance
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: |
          pip install pillow
          mkdir -p frontend/visual-evidence
          if test -f frontend/recordings/facetmark-reading.webm; then
            ffmpeg -y -i frontend/recordings/facetmark-reading.webm -vf scale=1280:-2 -c:v libx264 -crf 25 -pix_fmt yuv420p -movflags +faststart frontend/visual-evidence/facetmark-reading.mp4
            ffmpeg -y -i frontend/recordings/facetmark-reading.webm -vf 'fps=1,scale=480:-2,tile=3x4' -frames:v 1 frontend/visual-evidence/interaction-storyboard.jpg
          fi
          if test -f frontend/recordings/facetmark-interactions.webm; then
            ffmpeg -y -i frontend/recordings/facetmark-interactions.webm -vf scale=1280:-2 -c:v libx264 -crf 25 -pix_fmt yuv420p -movflags +faststart frontend/visual-evidence/facetmark-interactions.mp4
          fi
          if test -f frontend/recordings/facetmark-folders.webm; then
            ffmpeg -y -i frontend/recordings/facetmark-folders.webm -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart frontend/visual-evidence/facetmark-folders.mp4
          fi
          python scripts/experience_evidence.py
      - name: Upload small visual evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facetmark-visual-evidence
          path: frontend/visual-evidence/
          retention-days: 14
      - name: Build Python distributions containing the workbench
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: python -m build
      - name: Verify wheel resources
        if: ${{ !cancelled() && steps.frontend.outcome == 'success' }}
        run: python scripts/check_web_bundle.py
      - name: Upload review evidence and shared Web build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facetmark-experience-review
          path: |
            frontend/screenshots/
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results-matrix/
            frontend/playwright-report-matrix/
            frontend/package-lock.json
            frontend/src/
            frontend/tests/
            src/facetmark/web/dist/
            dist/*.whl
            dist/*.tar.gz
          retention-days: 14
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: extension
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: facetmark-extension-preview
          path: extension/dist/
          retention-days: 14
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t facetmark:experience .
      - name: Verify shared UI in isolated container
        run: |
          docker run -d --name facetmark-check --read-only --tmpfs /tmp -v fmtest:/data -p 127.0.0.1:8792:8787 facetmark:experience
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8792/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8792/app | grep 'id="root"'
          test "$(docker exec facetmark-check id -u)" = '65532'
      - if: failure()
        run: docker logs facetmark-check
