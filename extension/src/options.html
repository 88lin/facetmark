<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Facetmark settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { width: 560px; max-height: none; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 400; }
      .ok { color: #75a025; }
      .bad { color: #ff9400; }
      p.hint { color: var(--muted); font-size: 12px; }
      #state { margin: 14px 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <h2>Facetmark</h2>
    <p class="hint">
      Start the server with <code>facetmark serve</code>. It prints a pairing token on
      first run; paste it below. Nothing leaves your machine except the model calls you
      configure on the server side.
    </p>

    <label for="endpoint">Server</label>
    <input id="endpoint" type="text" placeholder="http://127.0.0.1:8787" />

    <label for="token">Pairing token</label>
    <input id="token" type="text" placeholder="paste the token printed by facetmark serve" />

    <label class="row"><input id="channelB" type="checkbox" /> Let Facetmark read pages the server cannot fetch</label>
    <label class="row"><input id="paused" type="checkbox" /> Pause background fetching</label>

    <div id="state"></div>
    <button id="save" type="button">save</button>
    <button id="drain" type="button">fetch queued pages now</button>

    <script type="module" src="options.js"></script>
  </body>
</html>
